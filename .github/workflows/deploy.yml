name: Publicar en GitHub Pages

on:
  push:
    branches:
      - main
      - claude/sexplay-couple-game-q6kd40
  workflow_dispatch:

# Permisos que necesita la publicación en Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Si se empujan varios commits seguidos, se publica el último y se cancela el anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Activa GitHub Pages en el repositorio si todavía no lo estaba.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      - name: Revisar el mazo
        run: npm run check:cards

      - name: Construir la app
        run: npm run build

      - name: Evitar que GitHub Pages procese el build
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
